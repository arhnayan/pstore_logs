name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build standalone app
        run: pyinstaller pstore-monitor.spec --noconfirm

      - name: Add launcher script
        shell: pwsh
        run: Copy-Item run.bat dist/pstore-monitor/run.bat

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/pstore-monitor/* -DestinationPath dist/pstore-monitor-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pstore-monitor-windows
          path: |
            dist/pstore-monitor/
            dist/pstore-monitor-windows.zip
          retention-days: 30

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pstore-monitor-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
